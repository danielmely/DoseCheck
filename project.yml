name: DoseCheck
options:
  bundleIdPrefix: com.danielmely
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DoseCheck:
    type: application
    platform: iOS
    sources:
      - DoseCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielmely.dosecheck
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DoseCheck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
